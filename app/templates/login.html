<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CyberTrack Login Page</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>

<body>
  <header class="header">
    <img src="{{ url_for('static', filename='images/CyberTrack.png') }}" alt="CyberTrack Logo" class="logo" />
    <h1 class="brand-name">Cybertrack</h1>
  </header>

  <div class="login-container">
    <form class="login-form" id="loginForm">
      <h2>Login</h2>
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required />

      <button type="submit">Login</button>
      <p class="error-message" id="errorMsg"></p>
    </form>
  </div>

  <footer>
    <p>&copy; 2025 CyberTrack — All Rights Reserved</p>
  </footer>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('errorMsg');

      try {
        const response = await fetch('/user/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: new URLSearchParams({
            username,
            password
          })
        });

        const result = await response.json();

        if (response.ok) {
          window.location.href = result.redirect || '/';
        } else {
          errorMsg.textContent = result.error || result.message || 'Login failed.';
        }
      } catch (err) {
        console.error('Login error:', err);
        errorMsg.textContent = 'An error occurred. Please try again.';
      }
    });
  </script>
</body>
</html>
