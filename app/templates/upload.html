<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Log File</title>
</head>
<body>
    <h1>Upload a Log File</h1>
    <form method="POST" enctype="multipart/form-data" action="/upload">
        <input type="file" name="logfile" accept=".csv,.log" required>
        <button type="submit">Upload</button>
    </form>
</body>
</html>
